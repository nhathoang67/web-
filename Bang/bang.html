<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng dữ liệu</title>
</head>
<body>
    <table align="center" width="80%" border="2" cellspacing="2" cellpadding="6">
        <caption>Bảng dữ liệu</caption>
        <tr bgcolor="lavender">
            <th rowspan="2">Time</th>
            <th align="center" colspan="3">Quarter 1</th>
            <th align="center" colspan="3">Quarter 2</th>
        </tr>
        <tr>
            <td>Jan</td>
            <td>Feb</td>
            <td>Mar</td>
            <td>Apr</td>
            <td>May</td>
            <td>Jun</td>
        </tr>
        <tr>
            <th rowspan="2"
            bgcolor="lavender">Data</th>
            <td>1000</td>
            <td>1500</td>
            <td>2000</td>
            <td>2500</td>
            <td>3000</td>
            <td>3500</td>
        </tr>
        <tr>
            <td>4000</td>
            <td>4500</td>
            <td>5000</td>
            <td>5500</td>
            <td>6000</td>
            <td>6500</td>
        </tr>
    </table>
    
</body>
</html>
