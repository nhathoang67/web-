
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ cá</title>

    <style>
        #hoca {
    position: fixed;
    bottom: 0;
    left: 1%;
    width: 98%;
    height: 75%;
    box-sizing: border-box;
    overflow: hidden;

    background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIj-1CyUYGrG8eYiqMcmQoPiToe6bWpRrN_qInxmME9bKDRNTpohDkC5PM&s=10");
       background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;

    border: 2px double blue;
    border-top: 0;
}

        img {
            position: absolute;
            width: 150px;
            max-width: 30%;
            border-radius: 10px;
        }

        .ca1 {
    bottom: 50px;
    left: 0;
    animation: boi1 20s linear infinite;
}

.ca2 {
    bottom: 180px;
    left: 0;
    animation: boi2 25s linear infinite;
}
.ca3 {
    bottom: 200px;
    left: 0;
    animation: boi2 15s linear infinite;

}

@keyframes boi1 {
    0% {
        left: 0;
        transform: scaleX(1);
    }

    49.9% {
        left: calc(100% - 150px);
        transform: scaleX(1);
    }

    50% {
        left: calc(100% - 150px);
        transform: scaleX(-1);
    }

    99.9% {
        left: 0;
        transform: scaleX(-1);
    }

    100% {
        left: 0;
        transform: scaleX(1);
    }
}

@keyframes boi2 {
    0% {
        left: 0;
        transform: scaleX(1);
    }

    49.9% {
        left: calc(100% - 150px);
        transform: scaleX(1);
    }

    50% {
        left: calc(100% - 150px);
        transform: scaleX(-1);
    }

    99.9% {
        left: 0;
        transform: scaleX(-1);
    }

    100% {
        left: 0;
        transform: scaleX(1);
    }
}

    </style>
</head>

<body>

    <div id="hoca">

        <img class="ca1"
        src="https://cdn.pixabay.com/photo/2013/07/12/13/58/scuba-diving-147683_960_720.png">

        <img class="ca2"
        src=" ">
        <img class="ca3" 
        src="" >
    </div>

</body>
</html>
